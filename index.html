  <!-- Self-hosted Montserrat (see public/fonts/README.md). Both files are used above the fold. -->

  <link rel="preload" href="%BASE_URL%fonts/montserrat-latin-800-italic.woff2" as="font" type="font/woff2" crossorigin />

  <script>
    // Runs before first paint: restore the theme (default = dark) and mark the
    // document as scripted so reveal styles only hide content when JS can show it.
    (function () {
      var root = document.documentElement;
      var dark = true;
      try { dark = localStorage.getItem('theme') !== 'light'; } catch (e) {}
      root.classList.add('js');
      root.classList.toggle('dark', dark);
      root.style.colorScheme = dark ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#f4f3ee');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
